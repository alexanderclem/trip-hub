name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser for guest-flow regressions
        run: npx playwright install --with-deps chromium
      - name: Check guest flows, appearance and keyboard behavior
        run: >-
          npx playwright test
          tests/e2e/guest-evaluation.spec.ts
          tests/e2e/first-run.spec.ts
          tests/e2e/appearance.spec.ts
          tests/e2e/ux-patterns.spec.ts
          tests/e2e/wrapped.spec.ts
          tests/e2e/journal.spec.ts
          --workers=1
      - name: Check operator flows with local fixtures
        run: >-
          npx playwright test
          tests/e2e/access-roles.spec.ts
          tests/e2e/organizers-pricing.spec.ts
          tests/e2e/operator-dashboard.spec.ts
          tests/e2e/payments-offer.spec.ts
          tests/e2e/payments.spec.ts
          tests/e2e/repeat-business.spec.ts
          tests/e2e/booking-travelers.spec.ts
          tests/e2e/campaigns.spec.ts
          tests/e2e/referrals.spec.ts
          tests/e2e/imports.spec.ts
          --workers=1
